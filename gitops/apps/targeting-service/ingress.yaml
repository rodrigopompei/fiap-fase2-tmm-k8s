apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: targeting-service
  namespace: targeting-service
  annotations:
    # Compartilha o mesmo ALB entre todos os microserviços com este grupo
    alb.ingress.kubernetes.io/group.name: fiap-fase2-prod
    # Prioridade dentro do grupo (menor = maior prioridade); cada serviço usa um valor único
    alb.ingress.kubernetes.io/group.order: "30"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /targeting/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /targeting/health
            pathType: Exact
            backend:
              service:
                name: targeting-service
                port:
                  number: 80
          - path: /targeting
            pathType: Prefix
            backend:
              service:
                name: targeting-service
                port:
                  number: 80
