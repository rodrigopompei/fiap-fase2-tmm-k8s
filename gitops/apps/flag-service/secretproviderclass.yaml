apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: flag-service-secrets
  namespace: flag-service
spec:
  provider: aws
  parameters:
    region: us-east-2
    objects: |
      - objectName: "flag-service/DATABASE_URL"
        objectType: secretsmanager
        objectAlias: DATABASE_URL
  secretObjects:
    - secretName: flag-service-secrets
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
