# Raiz do arquivo docker-compose.yaml.
# "services" declara todos os containers que serão criados e gerenciados juntos.
# Os valores ${VAR} são lidos de um arquivo ".env" na mesma pasta no momento
# em que o "docker compose up" é executado. Nunca coloque senhas diretamente aqui.
services:

  # ─────────────────────────────────────────────────────────────────────────────
  # Banco de dados PostgreSQL exclusivo do auth-service
  # ─────────────────────────────────────────────────────────────────────────────
  db-auth-service:
    # Nome fixo do container no Docker (visível em "docker ps").
    # Outros serviços podem usar este nome como hostname na rede interna.
    container_name: auth-service-db

    # Usa a imagem oficial do PostgreSQL 17 baseada em Alpine (imagem mínima).
    # Fixar a versão (17) evita surpresas com breaking changes em versões futuras.
    image: postgres:17-alpine

    # Reinicia o container automaticamente em qualquer falha ou reboot do host.
    restart: always

    environment:
      # Variáveis reconhecidas pela imagem oficial do PostgreSQL:
      # POSTGRES_USER     → cria o superusuário inicial do banco.
      # POSTGRES_PASSWORD → define a senha desse usuário.
      # POSTGRES_DB       → cria o banco de dados com este nome na inicialização.
      # Os valores vêm do arquivo .env para não ficarem expostos no repositório.
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}

    volumes:
      # Bind mount: monta o script SQL local dentro do container no caminho
      # /docker-entrypoint-initdb.d/. O PostgreSQL executa automaticamente
      # todos os .sql encontrados nesse diretório na primeira inicialização.
      - ./auth-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql

      # Volume nomeado: persiste os dados do banco entre restarts e "docker compose down".
      # Sem este volume, todos os dados seriam perdidos ao parar o container.
      - pgdata-auth-service-db:/var/lib/postgresql/data

    ports:
      # Mapeia host:container. Expõe a porta 5432 do container na porta 5432 do host.
      # Útil para conectar via cliente externo (DBeaver, psql, etc.) durante o desenvolvimento.
      # Em produção, remova este mapeamento para não expor o banco fora da rede Docker.
      - "5432:5432"

  # ─────────────────────────────────────────────────────────────────────────────
  # Banco de dados PostgreSQL exclusivo do targeting-service
  # ─────────────────────────────────────────────────────────────────────────────
  targeting-db:
    container_name: targeting-db
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${TARGETING_DB_USERNAME}
      - POSTGRES_PASSWORD=${TARGETING_DB_PASSWORD}
      - POSTGRES_DB=${TARGETING_DB_DATABASE}
    volumes:
      - ./targeting-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata-targeting-db:/var/lib/postgresql/data
    ports:
      # Porta 5433 no host → 5432 no container.
      # Usa porta diferente para não conflitar com o db-auth-service (5432) no host.
      - "5433:5432"

  # ─────────────────────────────────────────────────────────────────────────────
  # Banco de dados PostgreSQL exclusivo do flag-service
  # ─────────────────────────────────────────────────────────────────────────────
  flag-service-db:
    container_name: flag-service-db
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${FLAG_DB_USERNAME}
      - POSTGRES_PASSWORD=${FLAG_DB_PASSWORD}
      - POSTGRES_DB=${FLAG_DB_DATABASE}
    volumes:
      - ./flag-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata-flag-service-db:/var/lib/postgresql/data
    ports:
      # Porta 5434 no host → 5432 no container.
      # Terceira porta distinta para não conflitar com os outros dois bancos.
      - "5434:5432"

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis — cache em memória usado pelo evaluation-service
  # ─────────────────────────────────────────────────────────────────────────────
  redis:
    container_name: redis-evaluation-service
    # Redis 7 em Alpine. Usado para cache de resultados de avaliação de flags,
    # evitando chamadas repetidas aos outros serviços a cada requisição.
    image: redis:7-alpine
    restart: always
    ports:
      # Expõe a porta padrão do Redis no host para inspeção durante desenvolvimento.
      # Em produção, remova para não expor o Redis externamente.
      - "6379:6379"

  # ─────────────────────────────────────────────────────────────────────────────
  # auth-service — responsável por autenticação e emissão de tokens
  # ─────────────────────────────────────────────────────────────────────────────
  auth-service:
    container_name: auth-service

    # "build" instrui o Compose a construir a imagem a partir do Dockerfile
    # localizado no diretório indicado, em vez de baixar uma imagem pronta.
    build: ./auth-service

    restart: always
    environment:
      # URL de conexão completa com o banco. O hostname "db-auth-service" resolve
      # para o IP do container de mesmo nome dentro da rede Docker interna.
      # Formato: postgres://usuario:senha@host:porta/banco
      - DATABASE_URL=postgres://${DB_USERNAME}:${DB_PASSWORD}@db-auth-service:5432/${DB_DATABASE}

      # Porta em que o serviço Go vai escutar (lida pela aplicação via os.Getenv).
      - PORT=8001

      # Chave mestra usada para assinar e validar tokens internos.
      # Deve ser uma string longa e aleatória; nunca commitar o valor real.
      - MASTER_KEY=${MASTER_KEY}

    ports:
      - "8001:8001"

    # Garante que o container do banco suba antes do serviço.
    # Atenção: "depends_on" verifica apenas se o container iniciou, não se o
    # PostgreSQL já está pronto para aceitar conexões. Para resiliência real,
    # a aplicação deve implementar retry de conexão internamente.
    depends_on:
      - db-auth-service

  # ─────────────────────────────────────────────────────────────────────────────
  # targeting-service — gerencia regras de segmentação de usuários
  # ─────────────────────────────────────────────────────────────────────────────
  targeting-service:
    container_name: targeting-service
    build: ./targeting-service
    restart: always
    environment:
      # "postgresql://" (com "l" no final) é o formato usado pelo driver Python (psycopg2/asyncpg).
      # O hostname "targeting-db" aponta para o container de banco deste serviço.
      - DATABASE_URL=postgresql://${TARGETING_DB_USERNAME}:${TARGETING_DB_PASSWORD}@targeting-db:5432/${TARGETING_DB_DATABASE}
      - PORT=8003

      # URL do auth-service para validação de tokens nas requisições recebidas.
      # Usa o nome do container como hostname dentro da rede Docker.
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}

    ports:
      - "8003:8003"

    depends_on:
      # Precisa do banco próprio e do auth-service (para validar tokens).
      - targeting-db
      - auth-service

  # ─────────────────────────────────────────────────────────────────────────────
  # flag-service — gerencia feature flags (criação, ativação, desativação)
  # ─────────────────────────────────────────────────────────────────────────────
  flag-service:
    container_name: flag-service
    build: ./flag-service
    restart: always
    environment:
      - DATABASE_URL=postgresql://${FLAG_DB_USERNAME}:${FLAG_DB_PASSWORD}@flag-service-db:5432/${FLAG_DB_DATABASE}
      - PORT=8002
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
    ports:
      - "8002:8002"
    depends_on:
      - flag-service-db
      - auth-service

  # ─────────────────────────────────────────────────────────────────────────────
  # analytics-service — coleta e expõe métricas de uso das flags
  # ─────────────────────────────────────────────────────────────────────────────
  analytics-service:
    container_name: analytics-service
    build: ./analytics-service
    restart: always
    environment:
      - PORT=8005
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL}
    ports:
      - "8005:8005"
    depends_on:
      # Depende dos três serviços principais pois agrega dados de todos eles.
      - auth-service
      - targeting-service
      - flag-service

  # ─────────────────────────────────────────────────────────────────────────────
  # evaluation-service — avalia se uma flag está ativa para um dado contexto
  # É o serviço de maior throughput: consultado a cada requisição dos clientes.
  # ─────────────────────────────────────────────────────────────────────────────
  evaluation-service:
    container_name: evaluation-service
    build: ./evaluation-service
    restart: always
    environment:
      - PORT=8004

      # URL de conexão com o Redis. Formato: redis://host:porta
      # Usado para cachear resultados de avaliação e reduzir latência.
      - REDIS_URL=${REDIS_URL}

      # URLs internas dos serviços consultados durante a avaliação de flags.
      - FLAG_SERVICE_URL=${FLAG_SERVICE_URL}
      - TARGETING_SERVICE_URL=${TARGETING_SERVICE_URL}

      # Chave de API usada para autenticar chamadas entre serviços internos.
      # Deve ser diferente da MASTER_KEY e gerada aleatoriamente.
      - SERVICE_API_KEY=${SERVICE_API_KEY}

      # Credenciais e configuração do AWS SQS.
      # O evaluation-service publica eventos de avaliação na fila para
      # processamento assíncrono pelo analytics-service.
      - AWS_SQS_URL=${AWS_SQS_URL}           # URL completa da fila SQS
      - AWS_REGION=${AWS_REGION}             # Região AWS (ex: us-east-1)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}         # ID da chave IAM
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY} # Segredo da chave IAM

    ports:
      - "8004:8004"

    depends_on:
      # Precisa do Redis (cache), flag-service e targeting-service
      # para conseguir avaliar uma flag corretamente.
      - redis
      - flag-service
      - targeting-service

# ─────────────────────────────────────────────────────────────────────────────
# Volumes nomeados
# Declarados aqui para que o Docker Compose os gerencie como recursos de primeiro nível.
# Persistem os dados dos bancos PostgreSQL entre "docker compose down" e "up".
# Para apagar os dados completamente: "docker compose down -v"
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  pgdata-auth-service-db:       # Dados do PostgreSQL do auth-service
  pgdata-targeting-db:          # Dados do PostgreSQL do targeting-service
  pgdata-flag-service-db:       # Dados do PostgreSQL do flag-service
  pgdata-targeting-service-db:  # Reservado (declarado mas não montado por nenhum serviço atualmente)